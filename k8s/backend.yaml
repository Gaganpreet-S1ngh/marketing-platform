apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mp-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/gaganpreet-s1ngh/marketing-platform-backend:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: PORT
              value: "7007"
            - name: NODE_ENV
              value: "production"
            - name: REDIS_HOST
              value: "redis.mp-prod.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: FRONTEND_URL
              value: "https://187.127.174.68.sslip.io"
          ports:
            - containerPort: 7007
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 7007
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 7007
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mp-prod
spec:
  selector:
    app: backend
  ports:
    - port: 7007
      targetPort: 7007
  type: ClusterIP
