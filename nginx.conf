# Nginx Configuration for Marketing Platform
# Designed for local development and ngrok exposure (ngrok http 80)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # Upstream Backend (Node.js/Express)
    upstream backend_nodes {
        server 127.0.0.1:7007;
        keepalive 32;
    }

    # Upstream Frontend (Next.js)
    upstream frontend_nodes {
        server 127.0.0.1:3010;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # ------------------------------------------------------------------
        # API Routes Proxy -> Backend (Port 7007)
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ------------------------------------------------------------------
        # Short Link Redirects -> Backend (Port 7007)
        # ------------------------------------------------------------------
        location /r/ {
            proxy_pass http://backend_nodes/api/r/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ------------------------------------------------------------------
        # Web Application -> Frontend (Next.js Port 3010)
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
