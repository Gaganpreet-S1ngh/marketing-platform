name: Build and Push Docker Images

on:
  push:
    branches: [ "master", "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          - service: backend
            context: ./backend
            build_args: ""

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Lowercase IMAGE_OWNER
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_short }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-manifests
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Lowercase IMAGE_OWNER
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update image tags in k8s manifests
        run: |
          for svc in backend frontend; do
            if [ -f "k8s/${svc}.yaml" ]; then
              sed -i "s|image: ${{ env.REGISTRY }}/.*/${{ github.event.repository.name }}-${svc}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-${svc}:${{ steps.vars.outputs.sha_short }}|" "k8s/${svc}.yaml"
            fi
          done
          if [ -f "k8s/worker.yaml" ]; then
            sed -i "s|image: ${{ env.REGISTRY }}/.*/${{ github.event.repository.name }}-backend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-backend:${{ steps.vars.outputs.sha_short }}|" "k8s/worker.yaml"
          fi

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/*.yaml
          git diff --staged --quiet || {
            git commit -m "chore: update image tags to ${{ steps.vars.outputs.sha_short }} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
